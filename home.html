<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="rockmush.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brianna Zhao — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=League+Spartan:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .scene {
      position: relative;
      width: 100vw; height: 100vh;
      background: #010202;
      overflow-x: visible;
      overflow-y: hidden;
    }

    .hero-sky {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 40% 25%, rgba(30, 80, 45, 0.22) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 65%, rgba(20, 50, 70, 0.15) 0%, transparent 45%),
        linear-gradient(to bottom, #010202 0%, #020503 60%, #040c04 100%);
    }

    .scene-rail-overlay {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: min(44vw, 480px);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: rgba(1, 12, 5, 0.38);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      border-right: 1px solid rgba(140, 210, 155, 0.08);
      transition: opacity 0.45s ease;
    }
    .scene:has(.work-rail.has-active) .scene-rail-overlay,
    .scene:has(.work-rail .category:hover) .scene-rail-overlay,
    .scene:has(.work-rail .category:focus-within) .scene-rail-overlay {
      opacity: 1;
    }

    .layout {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(340px, 44vw) 1fr;
      height: 100vh;
      overflow: visible;
      background: transparent;
      pointer-events: none;
    }
    .layout > * { pointer-events: auto; }
    .hero-spacer {
      position: relative;
      z-index: 12;
      overflow: visible;
      pointer-events: none;
    }

    /* ── LEFT rail ─────────────────────────────────────────────── */
    .work-rail {
      position: relative;
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(6px, 1vh, 12px);
      padding: clamp(20px, 3vw, 36px);
      overflow: visible;
      background: transparent;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .work-rail > .category {
      position: relative;
      z-index: 2;
    }
    .work-rail > .category.is-active {
      z-index: 40;
    }

    .category {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      width: auto;
      overflow: visible;
      outline: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .work-rail.has-active .category:not(.is-active) {
      opacity: 0.35;
      transform: scale(0.96);
    }

    /* Preview thumbnail + label below */
    .category-block {
      flex: 0 0 auto;
      width: clamp(280px, 34vw, 400px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(2, 10, 5, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .category-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 2px solid rgba(180, 230, 190, 0.2);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(2, 10, 5, 0.2);
      backdrop-filter: blur(14px) saturate(130%);
      -webkit-backdrop-filter: blur(14px) saturate(130%);
      position: relative;
      isolation: isolate;
      transition:
        border-color 0.4s ease,
        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s ease,
        background 0.4s ease;
    }
    .category-thumb::after,
    .project-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(
        160deg,
        rgba(255, 255, 255, 0.07) 0%,
        rgba(0, 0, 0, 0.08) 100%
      );
      pointer-events: none;
    }
    .category-thumb img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      opacity: 0.78;
    }
    .category.product .category-thumb { border-color: rgba(255, 179, 198, 0.45); }
    .category.storytelling .category-thumb { border-color: rgba(179, 217, 255, 0.42); }

    .video-embed {
      position: absolute;
      top: 50%; left: 50%;
      z-index: 1;
      width: 480%;
      height: 480%;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
      opacity: 0.68;
      mix-blend-mode: screen;
    }

    .category-label {
      font-family: 'League Spartan', system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(16px, 2vw, 24px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(235, 255, 240, 0.88);
      transition: letter-spacing 0.4s ease, transform 0.4s ease;
    }
    .category.is-active .category-thumb,
    .category:hover .category-thumb,
    .category:focus-within .category-thumb {
      transform: scale(1.04) rotate(-1deg);
    }
    .category.product.is-active .category-thumb,
    .category.product:hover .category-thumb {
      border-color: rgba(255, 179, 198, 0.9);
      box-shadow: 0 0 28px rgba(255, 120, 160, 0.28);
    }
    .category.storytelling.is-active .category-thumb,
    .category.storytelling:hover .category-thumb {
      border-color: rgba(179, 217, 255, 0.9);
      box-shadow: 0 0 28px rgba(120, 190, 255, 0.25);
    }
    .category.is-active .category-label,
    .category:hover .category-label {
      letter-spacing: 0.2em;
      transform: translateX(3px);
    }

    /* Expand sideways → (absolute so collapsed panel doesn't stretch row height) */
    .category-panel {
      position: absolute;
      left: 100%;
      top: 0;
      display: grid;
      grid-template-columns: 0fr;
      opacity: 0;
      margin-left: 0;
      overflow: visible;
      pointer-events: none;
      transition:
        grid-template-columns 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.35s ease 0.06s,
        margin-left 0.5s ease;
    }
    .category-panel-inner {
      overflow: hidden;
      min-width: clamp(220px, 26vw, 300px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 0;
    }
    .category.is-active .category-panel,
    .category:hover .category-panel,
    .category:focus-within .category-panel {
      grid-template-columns: 1fr;
      opacity: 1;
      margin-left: clamp(16px, 2.5vw, 28px);
      pointer-events: auto;
    }
    .category.is-active .category-panel-inner,
    .category:hover .category-panel-inner,
    .category:focus-within .category-panel-inner {
      overflow: visible;
      padding-left: 2px;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: clamp(220px, 26vw, 300px);
      text-decoration: none;
      color: inherit;
      outline: none;
      opacity: 0;
      transform: translateX(-16px);
      transition:
        opacity 0.4s ease,
        transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .category.is-active .project-card,
    .category:hover .project-card,
    .category:focus-within .project-card {
      opacity: 1;
      transform: translateX(0);
    }
    .category.is-active .project-card:nth-child(2),
    .category:hover .project-card:nth-child(2) { transition-delay: 0.1s; }

    .project-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 2px solid rgba(180, 230, 190, 0.16);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(2, 10, 5, 0.2);
      backdrop-filter: blur(14px) saturate(130%);
      -webkit-backdrop-filter: blur(14px) saturate(130%);
      position: relative;
      isolation: isolate;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease, border-color 0.3s ease;
    }
    .project-thumb img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      opacity: 0.78;
      transition: transform 0.45s ease;
    }
    .project-card:hover .project-thumb { transform: scale(1.03) translateY(-2px); }
    .project-card:hover .project-thumb img { transform: scale(1.06); }
    .project-card.wirk:hover .project-thumb {
      border-color: rgba(190, 46, 92, 0.8);
      box-shadow: 0 8px 28px rgba(190, 46, 92, 0.35);
    }
    .project-card.boba:hover .project-thumb {
      border-color: rgba(100, 210, 90, 0.8);
      box-shadow: 0 8px 28px rgba(80, 200, 80, 0.3);
    }
    .project-card.mush:hover .project-thumb {
      border-color: rgba(55, 185, 225, 0.8);
      box-shadow: 0 8px 28px rgba(0, 160, 215, 0.3);
    }
    .project-name {
      font-family: 'League Spartan', system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(11px, 1.2vw, 14px);
      letter-spacing: 0.16em;
      text-transform: lowercase;
      color: rgba(220, 245, 225, 0.7);
      transition: color 0.25s ease, letter-spacing 0.3s ease;
    }
    .project-card:hover .project-name {
      color: #fff;
      letter-spacing: 0.2em;
    }

    /* ── Stars & name (name lives in right column only) ─────────── */
    #stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    #nameStars, #roleStars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    #nameStars, #roleStars {
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 50% 50%;
    }
    #nameStars {
      transform: scaleX(1.08);
    }
    .scene:has(.work-rail.has-active) #nameStars {
      transform: scaleX(1.2);
    }
    .scene:has(.work-rail.has-active) #roleStars {
      transform: scaleX(1.1);
    }

    .star {
      position: absolute; border-radius: 50%;
      background: rgba(215, 245, 220, 0.9);
      animation: starLife var(--dur, 12s) ease-in-out infinite;
    }
    .star.text-star {
      background: rgba(230, 255, 235, 1);
      filter: drop-shadow(0 0 2px rgba(180, 255, 210, 0.7));
      opacity: 0;
      animation:
        starAppear 0.7s ease-out var(--appear, 0s) both,
        textStarTwinkle var(--dur, 12s) ease-in-out var(--twinkle, 0.7s) infinite;
    }
    .star.role-star {
      background: rgba(255, 200, 215, 0.95);
      filter: drop-shadow(0 0 2px rgba(255, 179, 198, 0.65));
    }
    @keyframes starAppear {
      0%   { opacity: 0; transform: scale(0); }
      65%  { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.9; transform: scale(1); }
    }
    @keyframes textStarTwinkle {
      0%, 100% { opacity: 0.38; transform: scale(0.88); }
      50%      { opacity: 0.95; transform: scale(1.1); }
    }
    @keyframes starLife {
      0%   { opacity: 0; transform: scale(0.1); }
      20%  { opacity: 0.75; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(0.1); }
    }

    /* ── Logo & Nav ────────────────────────────────────────────── */
    .logo {
      position: fixed; top: 22px; left: 26px;
      z-index: 300; text-decoration: none; display: block;
    }
    .logo img {
      height: 90px; width: auto;
      filter: drop-shadow(0 0 6px rgba(200, 230, 210, 0.25));
      transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .logo:hover img {
      filter: drop-shadow(0 0 14px rgba(200, 230, 210, 0.85));
      transform: scale(1.06);
    }

    .nav {
      position: fixed; top: 24px; right: 26px; z-index: 300;
      display: flex; gap: 6px; align-items: center;
      background: rgba(6, 24, 8, 0.8);
      border: 1px solid rgba(28, 75, 35, 0.55);
      border-radius: 40px; padding: 10px 18px;
      backdrop-filter: blur(16px);
      animation: navIn 0.8s ease-out 0.4s both;
    }
    @keyframes navIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .nav-tab {
      display: inline-block; padding: 9px 26px; border-radius: 28px;
      font-size: 16px; font-family: Georgia, serif; letter-spacing: 1px;
      text-decoration: none; border: 1.5px solid transparent;
      transition: all 0.28s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .nav-tab.about   { color: #ffb3c6; }
    .nav-tab.project { color: #c9b3ff; }
    .nav-tab.connect { color: #b3d9ff; }
    .nav-tab:hover { transform: translateY(-2px) scale(1.04); }
    .nav-tab.about:hover {
      border-color: #ffb3c6; background: rgba(255, 179, 198, 0.07);
      box-shadow: 0 0 12px rgba(255, 179, 198, 0.5);
    }
    .nav-tab.connect:hover {
      border-color: #b3d9ff; background: rgba(179, 217, 255, 0.07);
      box-shadow: 0 0 12px rgba(179, 217, 255, 0.5);
    }
    .nav-dropdown-wrap { position: relative; }
    .nav-dropdown-wrap:hover .nav-tab.project {
      border-color: #c9b3ff; background: rgba(201, 179, 255, 0.07);
      box-shadow: 0 0 12px rgba(201, 179, 255, 0.5);
    }
    .project-dropdown {
      position: absolute; top: calc(100% + 14px); left: 50%;
      transform: translateX(-50%) translateY(-8px) scale(0.97);
      min-width: 160px;
      background: rgba(6, 24, 8, 0.92);
      border: 1px solid rgba(28, 75, 35, 0.55);
      border-radius: 20px; padding: 8px 6px;
      backdrop-filter: blur(18px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 400;
    }
    .project-dropdown::before {
      content: ''; position: absolute;
      bottom: 100%; left: 0; right: 0; height: 18px;
    }
    .nav-dropdown-wrap:hover .project-dropdown {
      opacity: 1; pointer-events: all;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .dropdown-item {
      display: block; padding: 9px 18px;
      color: #c9b3ff; font-size: 14px; font-family: Georgia, serif;
      letter-spacing: 0.7px; text-decoration: none;
      border-radius: 14px; border: 1.5px solid transparent;
      transition: all 0.22s ease;
    }
    .dropdown-item:hover {
      border-color: #c9b3ff; background: rgba(201, 179, 255, 0.08);
      transform: translateX(4px);
    }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .work-rail {
        order: 2; flex-direction: row; gap: 20px;
        padding: 20px; justify-content: center;
      }
      .category { flex-direction: column; }
      .category-panel-inner { flex-direction: row; gap: 10px; }
      .hero-spacer { min-height: 55vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

<div class="scene">
  <main class="hero-sky">
    <div id="stars"></div>
  </main>
  <div class="scene-rail-overlay" aria-hidden="true"></div>

  <div class="layout">

    <aside class="work-rail" id="workRail" aria-label="Work categories">

      <!-- Product: wirked preview → expands wirked + evil boba -->
      <div class="category product" tabindex="0">
        <div class="category-block">
          <div class="category-thumb">
            <img src="wirk_mockup.png" alt="Wïrked preview" loading="lazy">
          </div>
          <span class="category-label">Product</span>
        </div>
        <div class="category-panel">
          <div class="category-panel-inner">
            <a href="wirked.html" class="project-card wirk">
              <div class="project-thumb">
                <img src="wirk_mockup.png" alt="" loading="lazy">
              </div>
              <span class="project-name">wirked</span>
            </a>
            <a href="evil-boba.html" class="project-card boba">
              <div class="project-thumb">
                <img src="evil_bobaUF.png" alt="" loading="lazy">
              </div>
              <span class="project-name">evil boba</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Storytelling: mushroom babe video → expands same video -->
      <div class="category storytelling" tabindex="0">
        <div class="category-block">
          <div class="category-thumb">
            <iframe class="video-embed" loading="lazy"
              src="https://www.youtube.com/embed/QyoTqN33Ijc?autoplay=1&mute=1&loop=1&playlist=QyoTqN33Ijc&controls=0&modestbranding=1&rel=0"
              title="mushroom babe preview" allow="autoplay"></iframe>
          </div>
          <span class="category-label">Storytelling</span>
        </div>
        <div class="category-panel">
          <div class="category-panel-inner">
            <a href="mushroom-babe.html" class="project-card mush">
              <div class="project-thumb">
                <iframe class="video-embed" loading="lazy"
                  src="https://www.youtube.com/embed/QyoTqN33Ijc?autoplay=1&mute=1&loop=1&playlist=QyoTqN33Ijc&controls=0&modestbranding=1&rel=0"
                  title="mushroom babe" allow="autoplay"></iframe>
              </div>
              <span class="project-name">mushroom babe</span>
            </a>
          </div>
        </div>
      </div>

    </aside>

    <div class="hero-spacer" aria-hidden="true">
      <div id="nameStars"></div>
      <div id="roleStars"></div>
    </div>

  </div>
</div>

<a href="home.html" class="logo" title="Home"><img src="logo_small.png" alt="Logo"></a>

<nav class="nav">
  <a href="about.html" class="nav-tab about">about</a>
  <div class="nav-dropdown-wrap">
    <a href="#" class="nav-tab project">project</a>
    <div class="project-dropdown">
      <a href="wirked.html" class="dropdown-item">WIRKED</a>
      <a href="mushroom-babe.html" class="dropdown-item">mushroom babe</a>
      <a href="evil-boba.html" class="dropdown-item">EVIL Boba</a>
    </div>
  </div>
  <a href="connect.html" class="nav-tab connect">connect</a>
</nav>

<script>
  const starsEl = document.getElementById('stars');
  const nameStarsEl = document.getElementById('nameStars');
  const roleStarsEl = document.getElementById('roleStars');
  const rail = document.getElementById('workRail');
  const categories = [...document.querySelectorAll('.category')];

  /* Ambient stars */
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = 0.4 + Math.random() * 1.2;
    const dur = (8 + Math.random() * 12).toFixed(2);
    const delay = -(Math.random() * parseFloat(dur) * 2).toFixed(2);
    s.style.cssText =
      `width:${size}px;height:${size}px;` +
      `top:${Math.random() * 100}%;left:${Math.random() * 100}%;` +
      `--dur:${dur}s;animation-delay:${delay}s;opacity:0.45;`;
    starsEl.appendChild(s);
  }

  /* Star-formed text */
  function buildTextStars(container, lines, opts) {
    const {
      fontSize,
      fontStyle = 'italic',
      fontWeight = 'bold',
      fontFamily = '"Cormorant Garamond", Georgia, serif',
      step = 7,
      padL = 6,
      availW = 88,
      top = 18,
      availH = 38,
      build = 3.0,
      starClass = 'text-star',
      appearOffset = 0,
      lineGap = 40,
      letterSpacing = 0,
      scaleX = 1,
      minStar = 1.2,
      maxStar = 2.4
    } = opts;

    const lineCount = lines.length;
    const CW = 2000;
    const lineBlock = fontSize * 1.05;
    const CH = Math.round(48 + lineCount * lineBlock + (lineCount - 1) * lineGap);
    const canvas = document.createElement('canvas');
    canvas.width = CW;
    canvas.height = CH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#fff';
    ctx.font = `${fontStyle} ${fontWeight} ${fontSize}px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (letterSpacing) ctx.letterSpacing = `${letterSpacing}px`;

    lines.forEach((line, i) => {
      const y = 24 + lineBlock * 0.5 + i * (lineBlock + lineGap);
      ctx.fillText(line, CW / 2, y);
    });

    const imgData = ctx.getImageData(0, 0, CW, CH).data;
    const textPts = [];
    for (let y = 0; y < CH; y += step) {
      for (let x = 0; x < CW; x += step) {
        if (imgData[(y * CW + x) * 4] > 120) textPts.push({ x, y });
      }
    }

    textPts.forEach(pt => {
      const s = document.createElement('div');
      s.className = `star ${starClass}`;
      const size = minStar + Math.random() * (maxStar - minStar);
      const dur = (8 + Math.random() * 10).toFixed(2);
      const appear = (appearOffset + (pt.x / CW) * build + Math.random() * 0.45).toFixed(2);
      const twinkle = (parseFloat(appear) + 0.7).toFixed(2);
      const nx = pt.x / CW;
      const stretched = 0.5 + (nx - 0.5) * scaleX;
      const left = (padL + stretched * availW).toFixed(2);
      const topPct = (top + (pt.y / CH) * availH).toFixed(2);
      s.style.cssText =
        `width:${size}px;height:${size}px;` +
        `top:${topPct}%;left:${left}%;` +
        `--dur:${dur}s;--appear:${appear}s;--twinkle:${twinkle}s;`;
      container.appendChild(s);
    });
  }

  function buildHeroStars() {
    buildTextStars(nameStarsEl, ['Brianna', 'Zhao'], {
      fontSize: 172,
      lineGap: 22,
      letterSpacing: 18,
      scaleX: 1.22,
      step: 8,
      top: 38,
      availH: 24,
      availW: 88,
      padL: 6,
      build: 2.8,
      minStar: 2.2,
      maxStar: 4.2
    });
    buildTextStars(roleStarsEl, ['frontend · uiux · product'], {
      fontSize: 78,
      fontStyle: 'normal',
      fontWeight: '700',
      fontFamily: '"League Spartan", system-ui, sans-serif',
      letterSpacing: 10,
      lineGap: 0,
      step: 4,
      top: 64,
      availH: 10,
      availW: 88,
      padL: 6,
      build: 1.6,
      minStar: 1.8,
      maxStar: 3.4,
      starClass: 'text-star role-star',
      appearOffset: 3.2
    });
  }

  let heroBuilt = false;
  const buildOnce = () => { if (!heroBuilt) { heroBuilt = true; buildHeroStars(); } };
  document.fonts.ready.then(buildOnce);
  setTimeout(buildOnce, 1500);

  /* Vertical center active category */
  function centerCategory(cat) {
    if (!cat) return;
    const catRect = cat.getBoundingClientRect();
    const catCenter = catRect.top + catRect.height / 2;
    const shift = window.innerHeight / 2 - catCenter;
    rail.style.transform = `translateY(${shift}px)`;
    rail.classList.add('has-active');
    categories.forEach(c => c.classList.toggle('is-active', c === cat));
  }

  function resetRail() {
    rail.style.transform = 'translateY(0)';
    rail.classList.remove('has-active');
    categories.forEach(c => c.classList.remove('is-active'));
  }

  categories.forEach(cat => {
    const recenter = () => {
      centerCategory(cat);
      setTimeout(() => centerCategory(cat), 560);
    };
    cat.addEventListener('mouseenter', recenter);
    cat.addEventListener('focusin', recenter);
    cat.addEventListener('mouseleave', () => {
      setTimeout(() => {
        if (!rail.matches(':hover') && !rail.querySelector(':focus-within')) resetRail();
      }, 40);
    });
    cat.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!rail.matches(':hover') && !rail.querySelector(':focus-within')) resetRail();
      }, 40);
    });
    cat.addEventListener('keydown', e => {
      if (e.key === 'Escape') { cat.blur(); resetRail(); }
    });
  });

  window.addEventListener('resize', () => {
    const active = rail.querySelector('.is-active');
    if (active) centerCategory(active);
  });
</script>

</body>
</html>
